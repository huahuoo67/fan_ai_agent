services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: fan_ai_agent
      POSTGRES_USER: fan_ai_agent
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?Set PLATFORM_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./postgres/provision-platform.sh:/docker-entrypoint-initdb.d/02-platform.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fan_ai_agent -d fan_ai_agent"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8123"
      PLATFORM_DB_URL: jdbc:postgresql://postgres:5432/fan_ai_agent_v2
      PLATFORM_DB_USERNAME: fan_platform
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?Set PLATFORM_DB_PASSWORD in .env}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?Set DASHSCOPE_API_KEY in .env}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com}
      DASHSCOPE_CHAT_MODEL: ${DASHSCOPE_CHAT_MODEL:-qwen-plus}
      DASHSCOPE_MULTI_MODEL: ${DASHSCOPE_MULTI_MODEL:-false}
      DASHSCOPE_EMBEDDING_MODEL: ${DASHSCOPE_EMBEDDING_MODEL:-qwen3.7-text-embedding-flash}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      ADMIN_ACCOUNT: ${ADMIN_ACCOUNT:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ARTIFACT_ROOT: /app/tmp/platform-artifacts
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx768m
    volumes:
      - platform_files_v2:/app/tmp
    expose:
      - "8123"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8123:80"

volumes:
  pgdata:
  platform_files_v2:
