spring:
  application:
    name: fan-ai-agent
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  ai:
    retry:
      max-attempts: 1
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com}
        options:
          model: ${DASHSCOPE_CHAT_MODEL:qwen-plus}
          multi-model: ${DASHSCOPE_MULTI_MODEL:false}
          enable-search: false
      embedding:
        options:
          model: ${DASHSCOPE_EMBEDDING_MODEL:qwen3.7-text-embedding-flash}
          dimensions: 1024
server:
  port: ${SERVER_PORT:8123}
  servlet:
    context-path: /api
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
knife4j:
  enable: false
search-api:
  api-key: ${SEARCH_API_KEY:}
logging:
  level:
    org.springframework.ai: WARN
    com.alibaba.cloud.ai: WARN
